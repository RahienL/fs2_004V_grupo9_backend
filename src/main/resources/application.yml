spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pasteleria_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: pasteleria_user
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true

  sql:
    init:
      mode: never

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: tu-super-secreta-key-de-jwt-minimo-256-caracteres-para-seguridad-recomendada-aqui
  expiration: 86400000

logging:
  level:
    root: INFO
    cl.duoc.pasteleria: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
